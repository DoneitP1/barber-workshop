<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#f7f5ff"><title>Barber Workshop</title>
<style>
:root{--bg:#f7f5ff;--purple:#9678fa;--deep:#7655e8;--ink:#252432;--muted:#8d8a9b;--line:#e9e6f1;--lilac:#f0ecff;--green:#178151}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:14px}button,input,select,textarea{font:inherit}button{cursor:pointer}.hide{display:none!important}.wrap{max-width:620px;margin:0 auto;min-height:100dvh;padding-top:24px;padding-bottom:86px}.pad{padding:17px}.head{font-size:23px;font-weight:750;margin:3px 0 4px}.sub{font-size:12px;color:var(--muted);margin:4px 0 13px}.brand{text-align:center;padding:28px 20px 17px}.logo{display:grid;place-items:center;margin:auto auto 13px;width:64px;height:64px;border-radius:19px;background:var(--purple);color:white;font-size:32px;font-weight:800;box-shadow:0 8px 18px #9678fa55}.brand h1{margin:0;font-size:23px}.brand p{color:var(--muted);font-size:12px;line-height:1.5}.card{background:white;border-radius:17px;padding:15px;box-shadow:0 1px 3px #3125550c;border:1px solid #f0edf6;margin-bottom:11px}.tabswitch,.filters{display:flex;gap:5px;padding:4px;background:var(--lilac);border-radius:14px;margin-bottom:12px}.tabswitch button,.filters button{border:0;background:transparent;color:var(--muted);padding:10px;flex:1;border-radius:11px;font-size:12px;font-weight:600}.tabswitch .sel,.filters .sel{background:#fff;color:var(--deep);box-shadow:0 2px 6px #41366b15}.field{display:block;width:100%;padding:12px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none;color:var(--ink);margin:8px 0}.field:focus{border-color:var(--purple);box-shadow:0 0 0 3px #9678fa1d}textarea.field{min-height:70px;resize:vertical}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.btn{border:0;border-radius:12px;background:var(--purple);color:#fff;font-weight:700;padding:13px 15px}.btn:disabled{opacity:.55}.btn.full{width:100%;margin-top:8px}.outline{background:white;border:1px solid #ddd5fb;color:var(--deep)}.soft{background:var(--lilac);color:var(--deep)}.tiny{font-size:11px;color:var(--muted);text-align:center;margin-top:12px}.error{color:#b42318;font-size:12px;padding:5px 2px}.success{background:#e5f5ec;color:var(--green);border-radius:13px;padding:13px;font-size:12px;font-weight:650;margin-bottom:11px}.warning{background:#fff3e2;color:#985900;border-radius:13px;padding:13px;font-size:12px;margin-bottom:11px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.metricgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:11px 0}.metric{background:white;border-radius:16px;padding:14px;min-height:100px;border:1px solid #f0edf6}.metric .ico{font-size:20px;color:var(--deep)}.metric strong{display:block;font-size:18px;margin:7px 0 2px}.metric span{font-size:11px;color:var(--muted)}.section{font-size:17px;font-weight:750;margin:14px 0 9px}.item{display:flex;align-items:center;gap:11px;background:#fff;border-radius:15px;border:1px solid #f0edf6;padding:12px;margin-bottom:9px}.tile{width:46px;height:46px;border-radius:12px;background:var(--lilac);display:grid;place-items:center;font-size:20px;color:var(--deep);flex:none}.title{font-weight:650;font-size:13px;line-height:1.35}.small{color:var(--muted);font-size:10px;margin-top:4px}.price{color:var(--deep);font-size:11px;font-weight:650;margin-top:5px}.pill{font-size:10px;padding:5px 9px;border-radius:20px;background:#f0ecff;color:var(--deep);white-space:nowrap}.pill.ok{background:#e5f5ec;color:var(--green)}.pill.wait{background:#fff1d9;color:#916000}.actions{display:flex;gap:7px;margin-top:10px}.actions button{padding:7px 9px;border:1px solid var(--line);background:white;border-radius:9px;color:var(--deep);font-size:11px}.search{position:relative}.search .field{padding-left:37px}.search:before{content:'⌕';position:absolute;left:14px;top:17px;font-size:20px;color:var(--muted)}.bottom{position:fixed;z-index:4;bottom:24px;left:0;right:0;background:#ffffffed;border-top:1px solid #eeeaf4;display:flex;justify-content:center;padding:6px max(4px,env(safe-area-inset-left)) 5px;backdrop-filter:blur(14px)}.bottom button{border:0;background:transparent;min-width:0;flex:1;max-width:112px;padding:7px 1px 4px;color:var(--muted);font-size:9px}.bottom button b{display:block;font-size:19px;margin-bottom:3px;font-weight:500}.bottom button.sel{color:var(--deep);font-weight:700}.bottom button.sel b{display:inline-grid;place-items:center;background:var(--purple);color:white;border-radius:50%;width:35px;height:35px;margin-top:-17px;box-shadow:0 3px 8px #9678fa66}.bar{height:7px;border-radius:9px;background:var(--lilac);overflow:hidden}.bar i{display:block;height:100%;background:var(--purple);border-radius:9px}.back{border:0;background:white;font-size:19px;border-radius:12px;width:40px;height:40px;color:var(--ink)}.line{border:0;border-top:1px solid var(--line);margin:13px 0}.modal{position:fixed;inset:0;z-index:8;background:#15132370;display:flex;align-items:flex-end;justify-content:center}.sheet{background:var(--bg);width:100%;max-width:620px;max-height:91dvh;overflow:auto;padding:16px 17px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0}.sheet h2{margin:4px 0 13px;font-size:19px}.sheetfoot{display:flex;gap:9px;margin-top:12px}.sheetfoot button{flex:1}.chart{height:145px;display:flex;align-items:end;justify-content:space-around;padding:15px 12px;background:white;border-radius:15px}.chartcol{height:100%;display:flex;flex-direction:column;justify-content:end;align-items:center;gap:7px;flex:1}.chartbar{width:19px;border-radius:5px 5px 1px 1px;background:var(--purple)}.chartcol span{font-size:10px;color:var(--muted)}
</style></head><body><div id="root"></div>
<script>
const API=location.hostname==='appassets.androidplatform.net'?'http://10.0.2.2:8080/api':'/api';let token='',tab='Özet',page='',products=[],orders=[],ads=[],profile={},filters={products:'Tümü',orders:'Tümü'},days=30;const $=s=>document.querySelector(s),root=$('#root');
const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(Number(n)||0);
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function input(label,name,type='text',value='',attrs=''){return `<input class="field" type="${type}" name="${name}" placeholder="${label}" value="${esc(value)}" ${attrs}>`}
function nav(){return `<nav class="bottom">${[['Özet','▦'],['Ürünler','▣'],['Siparişler','▤'],['Reklam','⚑'],['Hesabım','♙']].map(([n,i])=>`<button class="${tab===n?'sel':''}" onclick="go('${n}')"><b>${i}</b>${n}</button>`).join('')}</nav>`}
function status(s){let c=['Yayında','Ödendi','Teslim edildi'].includes(s)?'ok':['Bekliyor','İncelemede'].includes(s)?'wait':'';return `<span class="pill ${c}">${esc(s)}</span>`}
function shell(content){root.innerHTML=`<main class="wrap"><div class="pad">${content}</div></main>${nav()}`}
async function loadAll(){if(!token)return;[products,orders,ads,profile]=await Promise.all([req('/products'),req('/orders'),req('/ads'),req('/profile')])}
function go(t){tab=t;page='';draw()}
function draw(){if(!token){auth();return}if(page==='order'){orderPage();return}if(page==='reports'){reportPage();return}if(page==='settlements'){settlementPage();return}({Özet:dashboard,Ürünler:productPage,Siparişler:orderPageList,Reklam:adPage,Hesabım:accountPage}[tab]||dashboard)()}
async function dashboard(){let d;try{d=await req('/dashboard')}catch(e){shell(`<h1 class="head">Mağaza özeti</h1><div class="error">${esc(e.message)} · <button onclick="logout()">Çıkış yap</button></div>`);return}shell(`<div class="row between"><div><div class="small" style="color:var(--deep)">BarBer Tedarikçi</div><h1 class="head">${esc(d.storeName||'Mağazam')}</h1></div><button class="back" onclick="dashboard()">⟳</button></div><div class="success">✿　Mağazanız yayında <span style="float:right">Onaylı</span></div>${d.lowStockCount?`<div class="warning">⚠　${d.lowStockCount} ürünün stoğu azaldı</div>`:''}<button class="btn outline full" onclick="page='reports';draw()">▥　Satış raporları</button><div class="metricgrid"><div class="metric"><div class="ico">▣</div><strong>${d.productCount}</strong><span>Ürün</span></div><div class="metric"><div class="ico">▤</div><strong>${d.orderCount}</strong><span>Sipariş</span></div><div class="metric"><div class="ico">⚠</div><strong>${d.lowStockCount}</strong><span>Düşük stok</span></div><div class="metric"><div class="ico">◉</div><strong>${money(d.totalSales)}</strong><span>Toplam satış</span></div></div><h2 class="section">Son siparişler</h2>${orders.slice(0,3).map(orderCard).join('')}`)}
function productPage(){shell(`<div class="row between"><div><h1 class="head">Ürünlerim</h1><div class="sub">${products.length} ürün kataloğunuzda</div></div><button class="btn" onclick="productModal()">＋ Ekle</button></div><div class="search"><input class="field" id="pSearch" placeholder="Ürün adı, kod veya kategori ara" oninput="drawProducts()"></div><div class="filters">${['Tümü','Aktif','Pasif','Düşük stok'].map(x=>`<button class="${filters.products===x?'sel':''}" onclick="filters.products='${x}';draw()">${x}</button>`).join('')}</div><div id="productList"></div>`);drawProducts()}
function drawProducts(){let q=($('#pSearch')?.value||'').toLowerCase();let a=products.filter(p=>(p.name+p.sku+p.category).toLowerCase().includes(q)&&(filters.products==='Tümü'||filters.products==='Aktif'&&p.active||filters.products==='Pasif'&&!p.active||filters.products==='Düşük stok'&&p.stock<10));$('#productList').innerHTML=a.map(p=>`<article class="item"><div class="tile">✂</div><div class="grow"><div class="title">${esc(p.name)}</div><div class="small">${esc(p.category)} · ${esc(p.sku)}</div><div class="price">${money(p.price)} · Stok: ${p.stock}</div><div class="actions"><button onclick="productModal('${p.id}')">Düzenle</button><button onclick="toggleProduct('${p.id}')">${p.active?'Pasife al':'Yayına al'}</button></div></div><span class="pill ${p.active?'ok':''}">${p.active?'Aktif':'Pasif'}</span></article>`).join('')||'<p class="small">Eşleşen ürün yok.</p>'}
async function toggleProduct(id){let p=products.find(x=>x.id===id);try{await req('/products/'+id+'/active','PATCH',{active:!p.active});await loadAll();draw()}catch(e){alert(e.message)}}
function productModal(id){let p=products.find(x=>x.id===id)||{};modal(`<h2>${id?'Ürünü düzenle':'Yeni ürün'}</h2><form id="productForm">${input('Ürün adı','name','text',p.name||'')}${input('Kategori','category','text',p.category||'')}${input('Stok kodu (SKU)','sku','text',p.sku||'')}<div class="grid2">${input('Salon satış fiyatı','price','number',p.price??'','min="0" step="0.01"')}${input('Stok adedi','stock','number',p.stock??'','min="0" step="1"')}</div><textarea class="field" name="description" placeholder="Ürün açıklaması">${esc(p.description||'')}</textarea><div class="sheetfoot"><button type="button" class="btn outline" onclick="closeModal()">Vazgeç</button><button class="btn">Değişiklikleri kaydet</button></div></form>`);$('#productForm').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.price=Number(b.price);b.stock=Number(b.stock);try{await req('/products'+(id?'/'+id:''),id?'PUT':'POST',b);await loadAll();closeModal();draw()}catch(x){alert(x.message)}}}
function orderCard(o){return `<article class="item" onclick="page='order';selectedOrder='${o.id}';draw()"><div class="grow"><div class="row between"><div class="title">${esc(o.id)}</div>${status(o.status)}</div><div class="small">${esc(o.date)} · ${esc(o.salon)}</div><div class="price">${money(o.total)}　›</div></div></article>`}
function orderPageList(){shell(`<h1 class="head">Salon siparişleri</h1><div class="search"><input class="field" id="oSearch" placeholder="Sipariş no veya salon ara" oninput="drawOrders()"></div><div class="filters">${['Tümü','Yeni','Onaylı','Hazırlanıyor','Teslim edildi'].map(x=>`<button class="${filters.orders===x?'sel':''}" onclick="filters.orders='${x}';draw()">${x}</button>`).join('')}</div><div id="orderList"></div>`);drawOrders()}
function drawOrders(){let q=($('#oSearch')?.value||'').toLowerCase();$('#orderList').innerHTML=orders.filter(o=>(o.id+o.salon).toLowerCase().includes(q)&&(filters.orders==='Tümü'||o.status===filters.orders)).map(orderCard).join('')||'<p class="small">Sipariş bulunamadı.</p>'}
let selectedOrder='';function orderPage(){let o=orders.find(x=>x.id===selectedOrder);if(!o){page='';orderPageList();return}shell(`<div class="row"><button class="back" onclick="page='';draw()">‹</button><h1 class="head" style="font-size:19px">${esc(o.id)}</h1></div><article class="card"><div class="row between"><span class="small">${esc(o.date)}</span>${status(o.status)}</div><hr class="line"><b>Salon bilgileri</b><p>${esc(o.salon)}</p><div class="small">☎ ${esc(o.phone)}</div><div class="small">⌖ ${esc(o.address)}</div><hr class="line"><b>Sevkiyat ve notlar</b><p class="small">${esc(o.note||'Teslimat notu bulunmuyor.')}</p></article><article class="card"><b>Sipariş edilen ürünler</b>${o.lines.map(l=>`<div class="row between" style="margin-top:13px"><div>${esc(l.name)}<div class="small">${l.quantity} adet</div></div><b>${money(l.unitPrice*l.quantity)}</b></div>`).join('')}<hr class="line"><div class="row between"><b>Toplam</b><b>${money(o.total)}</b></div></article>`)}
function adPage(){shell(`<h1 class="head">Reklam ve öne çıkarma</h1><article class="card"><div class="row between"><b>✦ Salon ekranında böyle görünecek</b><span class="pill">Sponsorlu</span></div><div class="tile" style="margin-top:15px">✂</div><div class="title">${esc(products[0]?.name||'Ürün tanıtımı')}</div><div class="small">Ürünlerinizi salonlara duyurun.</div></article><button class="btn full" onclick="adModal()">⚑ Reklam başvurusu oluştur</button><h2 class="section">Kampanyalarım</h2>${ads.map(a=>`<article class="item"><div class="grow"><div class="row between"><b>${esc(a.title)}</b>${status(a.status)}</div><div class="small">${esc(a.scope)} · ${money(a.budget)}</div><div class="price">${esc(a.productName)}</div></div></article>`).join('')}`)}
function adModal(){modal(`<h2>Reklam başvurusu</h2><form id="adForm"><div class="filters"><button type="button" class="sel" onclick="this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));this.classList.add('sel')">Tüm ürünler</button><button type="button" onclick="this.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));this.classList.add('sel')">Tek ürün</button></div><select class="field" name="productId">${products.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select>${input('Kampanya başlığı','title')}<textarea class="field" placeholder="Önizleme notu">Ürününüz salon ekranlarında öne çıkar.</textarea><div class="card"><b>✦ Önizleme</b><p>${esc(products[0]?.name||'Ürün')}</p><span>${money(products[0]?.price||0)}</span></div>${input('Aylık reklam ücreti','budget','number','150','min="0" step="50"')}<div class="sheetfoot"><button type="button" class="btn outline" onclick="closeModal()">Vazgeç</button><button class="btn">Başvuruyu gönder</button></div></form>`);$('#adForm').onsubmit=async e=>{e.preventDefault();let b=Object.fromEntries(new FormData(e.target));b.budget=Number(b.budget);b.scope=document.querySelector('.filters .sel')?.textContent||'Tek ürün';try{await req('/ads','POST',b);await loadAll();closeModal();draw()}catch(x){alert(x.message)}}}
function accountPage(){shell(`<h1 class="head">Hesabım</h1><article class="card"><div class="row"><div class="tile">▤</div><div class="grow"><div class="title">${esc(profile.companyName||'Firma bilgileri')}</div><div class="small">${esc(profile.email||'')}</div></div></div><p class="small">Firma ve iletişim bilgilerinizi yönetin.</p><button class="btn outline full" onclick="profileModal()">▣　Firma bilgileri</button></article><div class="item" onclick="page='settlements';draw()"><div class="tile">▤</div><b class="grow">Hakediş ve faturalar</b>›</div><div class="item" onclick="page='reports';draw()"><div class="tile">▥</div><b class="grow">Satış raporları</b>›</div><button class="btn outline full" onclick="logout()">Çıkış yap</button>`)}
function profileModal(){let fields=[['companyName','Şirket unvanı'],['contactPerson','Yetkili kişi'],['phone','Telefon'],['taxNumber','Vergi numarası'],['taxOffice','Vergi dairesi'],['city','Şehir'],['address','Firma adresi']];modal(`<h2>Firma bilgileri</h2><form id="profileForm">${fields.map(([k,n])=>input(n,k,'text',profile[k]||'')).join('')}<div class="sheetfoot"><button type="button" class="btn outline" onclick="closeModal()">Vazgeç</button><button class="btn">Kaydet</button></div></form>`);$('#profileForm').onsubmit=async e=>{e.preventDefault();try{profile=await req('/profile','PUT',Object.fromEntries(new FormData(e.target)));closeModal();draw()}catch(x){alert(x.message)}}}
async function reportPage(){let d;try{d=await req('/reports?days='+days)}catch(e){return shell(`<button class="back" onclick="page='';draw()">‹</button><div class="error">${esc(e.message)}</div>`)}shell(`<div class="row"><button class="back" onclick="page='';draw()">‹</button><h1 class="head" style="font-size:19px">Satış raporları</h1></div><div class="filters">${[7,30,90].map(n=>`<button class="${days===n?'sel':''}" onclick="days=${n};reportPage()">Son ${n} gün</button>`).join('')}</div><div class="metricgrid"><div class="metric"><span>Ciro</span><strong>${money(d.revenue)}</strong></div><div class="metric"><span>Sipariş</span><strong>${d.orderCount}</strong></div></div><div class="metric"><span>Ortalama sepet</span><strong>${money(d.averageBasket)}</strong></div><h2 class="section">Günlük satış</h2><div class="chart">${d.dailySales.map(x=>`<div class="chartcol"><div class="chartbar" style="height:${Math.max(12,x.value/Math.max(...d.dailySales.map(y=>y.value))*95)}px"></div><span>${esc(x.label)}</span></div>`).join('')}</div><h2 class="section">En çok satan ürünler</h2>${d.topProducts.map(p=>`<div class="item"><div class="grow">${esc(p.name)}</div><b>${money(p.price)}</b></div>`).join('')}`)}
async function settlementPage(){let d=await req('/settlements');shell(`<div class="row"><button class="back" onclick="page='';draw()">‹</button><h1 class="head" style="font-size:19px">Hakediş ve faturalar</h1></div><div class="metricgrid"><div class="metric"><span>Bekleyen</span><strong>${money(d.pending)}</strong></div><div class="metric"><span>Ödenen</span><strong>${money(d.paid)}</strong></div></div><div class="metric"><span>Toplam komisyon</span><strong>${money(d.commission)}</strong></div><h2 class="section">Faturalar</h2>${d.invoices.map(x=>`<div class="item"><div class="grow"><b>${esc(x.id)}</b><div class="small">${esc(x.date)}</div></div><div>${money(x.net)}<div style="margin-top:5px">${status(x.status)}</div></div></div>`).join('')}`)}
function modal(html){root.insertAdjacentHTML('beforeend',`<div class="modal" id="modal" onclick="if(event.target===this)closeModal()"><section class="sheet">${html}</section></div>`)}function closeModal(){$('#modal')?.remove()}
</script><script src="auth.js"></script></body></html>
